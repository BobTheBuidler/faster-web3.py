name: "Mypycify & Build Python Wheel"
description: "Set up Python, restore ccache, build a wheel for the current OS and Python version, save ccache, and upload the wheel artifact. The built wheel is cached to speed up subsequent runs with the same code."
inputs:
  python-version:
    description: "Python version to use (passed to actions/setup-python)"
    required: true
  cache:
    description: "Cache mode for actions/setup-python (e.g., pip). This input is passed directly to the 'cache' parameter of actions/setup-python."
    required: false
    default: ""
  cache-dependency-path:
    description: "Dependency files for actions/setup-python cache. This input is passed directly to the 'cache-dependency-path' parameter of actions/setup-python."
    required: false
    default: ""
outputs:
  artifact-name:
    description: "The name of the uploaded wheel artifact."
runs:
  using: "composite"
  steps:
    # The following inputs are passed directly to actions/setup-python
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}
        cache: ${{ inputs.cache }}
        cache-dependency-path: ${{ inputs.cache-dependency-path }}

    - name: Compute ccache restore-key prefix
      id: ccache_restore_key
      shell: bash
      run: |
        RESTORE_KEY="ccache-${{ runner.os }}-${{ inputs.python-version }}"
        echo "restore-key=$RESTORE_KEY" >> $GITHUB_OUTPUT

    - name: Compute hash key
      id: hash_key
      shell: bash
      run: |
        HASH_KEY="${{ hashFiles('pyproject.toml', 'setup.py', 'faster_web3/**/*.py', 'faster_ens/**/*.py', '**/*.c', '**/*.h') }}"
        echo "hash-key=$HASH_KEY" >> $GITHUB_OUTPUT

    - name: Compute ccache key
      id: ccache_key
      shell: bash
      run: |
        CCACHE_KEY="${{ steps.ccache_restore_key.outputs.restore-key }}-${{ hashFiles('pyproject.toml', '**/*.h', '**/*.c', 'faster_web3/**/*.py', 'faster_ens/**/*.py') }}"
        echo "ccache-key=$CCACHE_KEY" >> $GITHUB_OUTPUT

    - name: Compute unique artifact name
      id: artifact_name
      shell: bash
      run: |
        ARTIFACT_NAME="wheel-artifact-${{ runner.os }}-py${{ inputs.python-version }}-${{ steps.hash_key.outputs.hash-key }}"
        echo "artifact-name=$ARTIFACT_NAME" >> $GITHUB_OUTPUT

    - name: Cache built wheel (dist/)
      id: wheel-cache
      uses: actions/cache@v4
      with:
        path: dist/
        key: ${{ steps.artifact_name.outputs.artifact-name }}

    - name: Set ccache-dir variable
      if: steps.wheel-cache.outputs.cache-hit != 'true'
      run: |
        if [ "$RUNNER_OS" = "Linux" ]; then
          echo "CCACHE_DIR=$HOME/.cache/ccache" >> $GITHUB_ENV
        elif [ "$RUNNER_OS" = "macOS" ]; then
          echo "CCACHE_DIR=$HOME/Library/Caches/ccache" >> $GITHUB_ENV
        elif [ "$RUNNER_OS" = "Windows" ]; then
          echo "CCACHE_DIR=$HOME/.cache/ccache" >> $GITHUB_ENV
        fi
      shell: bash

    - name: Install ccache on Linux
      if: steps.wheel-cache.outputs.cache-hit != 'true' && runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y ccache
      shell: bash
    - name: Install ccache on macOS
      if: steps.wheel-cache.outputs.cache-hit != 'true' && runner.os == 'macOS'
      run: brew install ccache
      shell: bash
    - name: Install ccache on Windows
      if: steps.wheel-cache.outputs.cache-hit != 'true' && runner.os == 'Windows'
      run: choco install ccache --no-progress
      shell: bash

    - name: Restore ccache cache
      if: steps.wheel-cache.outputs.cache-hit != 'true'
      uses: actions/cache/restore@v4
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ${{ steps.ccache_key.outputs.ccache-key }}
        restore-keys: ${{ steps.ccache_restore_key.outputs.restore-key }}

    - name: Show ccache config and stats before build
      if: steps.wheel-cache.outputs.cache-hit != 'true'
      run: ccache --version && ccache -p -s
      shell: bash

    - name: Build wheel
      if: steps.wheel-cache.outputs.cache-hit != 'true'
      env:
        CC: ccache gcc
      run: |
        python -m pip install --upgrade pip
        python -m pip install --upgrade build
        python -m build --wheel
      shell: bash

    - name: Show ccache stats after build
      if: steps.wheel-cache.outputs.cache-hit != 'true'
      run: ccache -s
      shell: bash

    - name: Save ccache cache
      if: steps.wheel-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ${{ steps.ccache_key.outputs.ccache-key }}

    - name: Upload wheel artifact
      uses: actions/upload-artifact@v5
      with:
        name: ${{ steps.artifact_name.outputs.artifact-name }}
        path: dist/*.whl
