name: Tox

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '.circleci/**'
      - '.github/workflows/**'
      - '!.github/workflows/tox.yaml'
      - '.agents/**'
      - 'benchmarks/**'
      - '.gitignore'
      - '*.md'
  pull_request:
    branches: [main, master]
    paths-ignore:
      - '.circleci/**'
      - '.github/workflows/**'
      - '!.github/workflows/tox.yaml'
      - '.agents/**'
      - 'benchmarks/**'
      - '.gitignore'
      - '*.md'
  schedule:
    - cron: '0 9 * * *'  # Daily 9:00 UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HASH_KEY: |
    pyproject.toml
    setup.py
    faster_web3/**/*.py
    faster_ens/**/*.py
  PIP_CACHE_DEPENDENCY_PATH: |
    pyproject.toml
    setup.py
    tox.ini

jobs:
  build-ubuntu:
    name: Build wheel (ubuntu-latest, 3.${{ matrix.pyminor }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pyminor: ["10", "11", "12", "13", "13t", "14", "14t"]
      # limit parallelism for cronjob, otherwise blast it
      max-parallel: ${{ (github.event_name == 'schedule' || github.event_name == 'push') && 2 || 1000 }}
    outputs:
      wheel-artifact-names: ${{ steps.wheel.outputs.artifact-name }}
    steps:
      - uses: actions/checkout@v7
      - name: Build wheel for Python3.${{ matrix.pyminor }}
        id: wheel
        uses: BobTheBuidler/mypycify@v0.5.0
        with:
          python-version: 3.${{ matrix.pyminor }}
          hash-key: ${{ env.HASH_KEY }}
          ccache: true
          pip-cache-dependency-path: ${{ env.PIP_CACHE_DEPENDENCY_PATH }}
          # Only enable commit/PR and normalization for Python 3.14 on Linux
          push-source: ${{ matrix.pyminor == '14' && 'true' || 'false' }}
          commit-message: "${{ matrix.pyminor == '14' && 'chore: compile C files for source control' || '' }}"
          normalize-source: ${{ matrix.pyminor == '14' && 'true' || 'false' }}
          trigger-pr-number: ${{ github.event.pull_request.number }}
          trigger-branch-name: ${{ github.head_ref || github.ref_name }}
  build-macos:
    name: Build wheel (macos-latest, 3.${{ matrix.pyminor }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        pyminor: ["10", "11", "12", "13", "13t", "14", "14t"]
      # limit parallelism for cronjob, otherwise blast it
      max-parallel: ${{ (github.event_name == 'schedule' || github.event_name == 'push') && 2 || 1000 }}
    outputs:
      wheel-artifact-names: ${{ steps.wheel.outputs.artifact-name }}
    steps:
      - uses: actions/checkout@v7
      - name: Build wheel for Python3.${{ matrix.pyminor }}
        id: wheel
        uses: BobTheBuidler/mypycify@v0.5.0
        with:
          python-version: 3.${{ matrix.pyminor }}
          hash-key: ${{ env.HASH_KEY }}
          ccache: true
          pip-cache-dependency-path: ${{ env.PIP_CACHE_DEPENDENCY_PATH }}
          trigger-pr-number: ${{ github.event.pull_request.number }}
          trigger-branch-name: ${{ github.head_ref || github.ref_name }}
  build-windows:
    name: Build wheel (windows-latest, 3.${{ matrix.pyminor }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        pyminor: ["10", "11", "12", "13", "14"]
      # limit parallelism for cronjob, otherwise blast it
      max-parallel: ${{ (github.event_name == 'schedule' || github.event_name == 'push') && 2 || 1000 }}
    outputs:
      wheel-artifact-names: ${{ steps.wheel.outputs.artifact-name }}
    steps:
      - uses: actions/checkout@v7
      - name: Build wheel for Python3.${{ matrix.pyminor }}
        id: wheel
        uses: BobTheBuidler/mypycify@v0.5.0
        with:
          python-version: 3.${{ matrix.pyminor }}
          hash-key: ${{ env.HASH_KEY }}
          ccache: true
          pip-cache-dependency-path: ${{ env.PIP_CACHE_DEPENDENCY_PATH }}
          trigger-pr-number: ${{ github.event.pull_request.number }}
          trigger-branch-name: ${{ github.head_ref || github.ref_name }}

  tox:
    needs: [build-ubuntu, build-macos, build-windows]
    name: Test (${{ matrix.jobtype }}, 3.${{ matrix.pyminor }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        jobtype: [core, ens, integration-ethtester, lint, wheel]
        os: [ubuntu-latest, macos-latest, windows-latest]
        pyminor: ["10", "11", "12", "13", "13t", "14", "14t"]
        exclude:
          - os: windows-latest
            pyminor: "13t"
          - os: windows-latest
            pyminor: "14t"
      # limit parallelism for cronjob, otherwise blast it
      max-parallel: ${{ (github.event_name == 'schedule' || github.event_name == 'push') && 4 || 1000 }}
    env:
      TOXENV: ${{ matrix.os == 'windows-latest' && matrix.jobtype == 'wheel' && 'windows-wheel' || format('py3{0}-{1}', matrix.pyminor, matrix.jobtype) }}
      TOX_RECREATE_FLAG: ${{ github.event_name == 'schedule' && '-r' || '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.${{ matrix.pyminor }}
          cache: pip
          cache-dependency-path: ${{ env.PIP_CACHE_DEPENDENCY_PATH }}

      - name: Install tox
        run: python -m pip install tox

      - name: Cache .mypy_cache
        uses: actions/cache@v6
        with:
          path: .mypy_cache
          key: mypy-cache-${{ runner.os }}-${{ hashFiles('**/*.py', 'pyproject.toml') }}

      - name: Cache tox environment and hypothesis examples
        uses: actions/cache@v6
        with:
          path: |
            .tox
            .hypothesis
          key: ${{ runner.os }}-tox-${{ hashFiles('pyproject.toml', 'setup.py', 'tox.ini') }}-3.${{ matrix.pyminor }}-${{ matrix.jobtype }}
          save-always: ${{ env.TOX_RECREATE_FLAG == '-r' }}

      - name: Determine wheel artifact architecture
        id: artifact_arch
        shell: bash
        run: echo "value=$(uname -m)" >> "$GITHUB_OUTPUT"

      # Download the correct wheel artifact for this OS and Python version using only the pattern
      - name: Download wheel
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: BobTheBuidler_mypycified_wheel-${{ runner.os }}-${{ steps.artifact_arch.outputs.value }}-py3.${{ matrix.pyminor }}-source-*

      - name: Run tox
        shell: bash
        run: |
          set -euo pipefail
          wheel_path="$(find dist -name '*.whl' -print -quit)"
          test -n "$wheel_path"
          python -m tox run --installpkg="$wheel_path" ${{ env.TOX_RECREATE_FLAG }}
