name: Tox

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '.circleci/**'
      - '.github/workflows/**'
      - '!.github/workflows/tox.yaml'
      - 'benchmarks/**'
  pull_request:
    branches: [main, master]
    paths-ignore:
      - '.circleci/**'
      - '.github/workflows/**'
      - '!.github/workflows/tox.yaml'
      - 'benchmarks/**'
  schedule:
    - cron: '0 9 * * *'  # Daily 9:00 UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Python${{ matrix.python-version }} wheel for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.13t", "3.14", "3.14t"]
      # limit parallelism for cronjob, otherwise blast it
      max-parallel: ${{ (github.event_name == 'schedule' || github.event_name == 'push') && 4 || 1000 }}

    steps:
      - uses: actions/checkout@v5

      - name: Build wheel for Python${{ matrix.python-version }}
        id: wheel
        uses: BobTheBuidler/mypycify@master
        with:
          python-version: ${{ matrix.python-version }}
          hash-key: |
            pyproject.toml
            setup.py
            faster_web3/**/*.py
            faster_ens/**/*.py
            **/*.c
            **/*.h
          ccache: true
          pip-cache-dependency-path: |
            pyproject.toml
            setup.py
            tox.ini
            

  tox:
    needs: build
    name: Test (${{ matrix.jobtype }}, ${{ matrix.python-version}}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        jobtype: [core, ens, integration-ethtester, lint, wheel]
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.13t", "3.14", "3.14t"]
        include:
          - os: ubuntu-latest
            ccache-dir: ~/.cache/ccache
          - os: macos-latest
            ccache-dir: /Users/runner/Library/Caches/ccache
      # limit parallelism for cronjob, otherwise blast it
      max-parallel: ${{ (github.event_name == 'schedule' || github.event_name == 'push') && 4 || 1000 }}
    env:
      TOXENV: py${{ matrix.python-version }}-${{ matrix.jobtype }}
      TOX_RECREATE_FLAG: ${{ github.event_name == 'schedule' && '-r' || '' }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            setup.py
            tox.ini

      - name: Install tox
        run: python -m pip install tox

      - name: Cache .mypy_cache
        uses: actions/cache@v4
        with:
          path: .mypy_cache
          key: mypy-cache-${{ runner.os }}-${{ hashFiles('**/*.py', 'pyproject.toml') }}

      - name: Cache tox environment and hypothesis examples
        uses: actions/cache@v4
        with:
          path: |
            .tox
            .hypothesis
          key: ${{ runner.os }}-tox-${{ hashFiles('pyproject.toml', 'setup.py', 'tox.ini') }}-${{ matrix.python-version }}-${{ matrix.jobtype }}
          save-always: ${{ env.TOX_RECREATE_FLAG == '-r' }}

      - name: Download wheel
        uses: actions/download-artifact@v6
        with:
          name: ${{ needs.build.outputs.wheel-artifact-name }}
          path: .
          pattern: BobTheBuidler_mypycified_wheel_${{ runner.os }}-${{ matrix.python-version }}-

      - name: Run tox
        run: python -m tox run --installpkg=$(find . -name '*.whl') ${{ env.TOX_RECREATE_FLAG }}
