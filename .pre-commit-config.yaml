exclude: '.project-template|docs/conf.py'
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
    -   id: check-yaml
    -   id: check-toml
    -   id: end-of-file-fixer
    -   id: trailing-whitespace
-   repo: https://github.com/asottile/pyupgrade
    rev: v3.15.0
    hooks:
    -   id: pyupgrade
        args: [--py38-plus]
-   repo: https://github.com/psf/black
    rev: 23.9.1
    hooks:
    -   id: black
-   repo: https://github.com/PyCQA/flake8
    rev: 6.1.0
    hooks:
    -   id: flake8
        args:
        -   --per-file-ignores=__init__.py:F401 benchmarks/**/*.py:E501,E731,F401
            faster_web3/_utils/batching.py:F811
            faster_web3/_utils/contract_sources/contract_data/tuple_contracts.py:E501
            faster_web3/contract/base_contract.py:E501
            faster_web3/providers/eth_tester/middleware.py:E501
            scripts/benchmark/*.py:E501,F541
            tests/conftest.py:E501
            tests/core/contracts/conftest.py:E501
            tests/core/providers/test_async_http_provider.py:E501
        additional_dependencies:
        -   flake8-bugbear==23.9.16
        exclude: setup.py
-   repo: https://github.com/PyCQA/autoflake
    rev: v2.2.1
    hooks:
    -   id: autoflake
-   repo: https://github.com/pycqa/isort
    rev: 5.12.0
    hooks:
    -   id: isort
-   repo: https://github.com/pycqa/pydocstyle
    rev: 6.3.0
    hooks:
    -   id: pydocstyle
        additional_dependencies:
        -   tomli  # required until >= python311
-   repo: https://github.com/executablebooks/mdformat
    rev: 0.7.17
    hooks:
    -   id: mdformat
        additional_dependencies:
        -   mdformat-gfm
-   repo: local
    hooks:
    -   id: mypy-local
        name: run mypy with all dev dependencies present
        entry: python -m mypy -p faster_web3
        language: system
        always_run: true
        pass_filenames: false
-   repo: https://github.com/PrincetonUniversity/blocklint
    rev: v0.2.5
    hooks:
    -   id: blocklint
        args:
        -   --skip-files=.github/workflows/benchmark.yaml,.github/workflows/release.yaml,.github/workflows/tox.yaml,AGENTS.md,README.md,setup.py,benchmarks/results/unknown.md,docs/Makefile,docs/release_notes.rst,docs/web3.eth.rst,docs/faster_web3.eth.rst,docs/ens_overview.rst,docs/troubleshooting.rst,docs/transactions.rst,docs/web3.contract.rst,docs/faster_web3.contract.rst
        exclude: 'normalization_tests.json|\.github/workflows/(benchmark|release|tox)\.yaml|AGENTS.md|README.md|setup.py|benchmarks/results/unknown.md|docs/(Makefile|release_notes.rst|web3.eth.rst|faster_web3.eth.rst|ens_overview.rst|troubleshooting.rst|transactions.rst|web3.contract.rst|faster_web3.contract.rst)'
-   repo: local
    hooks:
    -   id: check-rst-files
        name: Check for .rst files in the top-level directory
        entry: sh -c 'ls *.rst 1>/dev/null 2>&1 && { echo "found .rst file in top-level folder"; exit 1; } || exit 0'
        language: system
        always_run: true
        pass_filenames: false
